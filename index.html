    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;

        nav {
            background: #111;
            padding: 20px;

        }

        header {

            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            font-size: 45px;
        }

        p {
            font-size: 20px;
        }

</head>

<body>

    <nav>
        <a href="#">Home</a>
